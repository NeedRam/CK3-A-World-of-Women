l_english:
 # Initial Cull Event - The Vanishing
 awow.1001.title: "The Vanishing"
 awow.1001.desc: "It began without warning. One morning, a strange and ethereal mist rolled across the known world, carrying with it a haunting silence. When the fog lifted, something had changed — something fundamental.\n\nThroughout courts, cottages, and castles across the realm, every man of noble blood and common birth alike was gone. Vanished as if they had never been. Their clothes lay folded, their swords still sheathed, their thrones still warm — but the men themselves had simply... ceased to be.\n\nScholars whisper of divine judgment. Mystics speak of cosmic balance finally tipping. But one truth is undeniable: this is now a world of women. The old order has crumbled, and a new age must rise from its ashes."
 awow.1001.a: "So it begins... a new age."
 awow_cull_count_tooltip: "[global_var:awow_cull_count] souls have been claimed by the cataclysm."
 
 # Regular Culling Event
 awow.0002.title: "The Culling"
 awow.0002.desc: "The culling has claimed its latest victims. [global_var:awow_cull_count] males have been taken, preserving the natural order of this world."
 awow.0002.a: "The culling continues..."
 
 # Frequency Selection Event
 awow.0003.title: "Choose the Culling Frequency"
 awow.0003.desc: "We must decide how often we cull the male population to maintain the natural order of this new world. How frequently shall we enforce our will?"
 awow.0003.a: "Every month — We must be vigilant."
 awow.0003.b: "Every 3 months — A firm but measured hand."
 awow.0003.c: "Every 6 months — Balance and order." 
 awow.0003.d: "Once a year — Let us not be consumed by this task."
 awow_frequency_monthly_tooltip: "Culling will now occur every month."
 awow_frequency_3months_tooltip: "Culling will now occur every 3 months."
 awow_frequency_6months_tooltip: "Culling will now occur every 6 months."
 awow_frequency_yearly_tooltip: "Culling will now occur once a year."
 
 # Interaction Notifications
 awow.0010.a: "Very well."
 awow.0011.a: "Understood."