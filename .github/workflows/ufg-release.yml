name: AWOW UFG release

'on':
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must match Installer/release-manifest.json)
        required: true
        default: 1.1.1
  push:
    tags:
      - 'ufg-v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a main-line release commit
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'UFG release builds must use a commit reachable from main.'
          }

      - name: Resolve and validate release version
        id: release
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $manifestPath = 'AWOW Universal Female Generation/Installer/release-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Release manifest is missing: $manifestPath"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifestVersion = [string]$manifest.release.version
          if ($manifestVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid checked-in UFG manifest version: $manifestVersion"
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF -notmatch '^refs/tags/ufg-v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "UFG release workflow received an invalid tag ref: $env:GITHUB_REF"
            }
            $releaseVersion = $env:GITHUB_REF_NAME -replace '^ufg-v', ''
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $releaseVersion = [string]$env:DISPATCH_VERSION
            if ([string]::IsNullOrWhiteSpace($releaseVersion)) {
              $releaseVersion = $manifestVersion
            }
          } else {
            throw "UFG release workflow received unsupported event: $env:GITHUB_EVENT_NAME"
          }

          if ($releaseVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid UFG release version: $releaseVersion"
          }
          if ($releaseVersion -ne $manifestVersion) {
            throw "UFG release version $releaseVersion does not match checked-in manifest version $manifestVersion."
          }
          "version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install installer build and test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r 'AWOW Universal Female Generation/Installer/python/requirements-build.txt'

      - name: Download and verify frozen published native release
        shell: pwsh
        run: |
          $root = 'AWOW Universal Female Generation'
          $manifest = Get-Content -LiteralPath "$root/Installer/release-manifest.json" -Raw | ConvertFrom-Json
          $native = $manifest.native_release
          if ([string]$native.version -ne '1.1.0') { throw "Unexpected pinned native version: $($native.version)" }
          if ([string]$native.source_commit -ne '835c71f954c0f89f46ce14d05c79e1a3a1d0ad77') { throw 'Pinned native source commit changed.' }
          $archive = Join-Path $env:RUNNER_TEMP 'ufg-native-v1.1.0.zip'
          Invoke-WebRequest -Uri ([string]$native.archive_url) -OutFile $archive
          $sha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne ([string]$native.archive_sha256).ToLowerInvariant()) { throw "Native archive hash mismatch: $sha" }
          "Native archive verified: $sha" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'ufg-native-verification.txt') -Encoding utf8

      - name: Build UFG installer executables
        shell: pwsh
        run: python 'AWOW Universal Female Generation/Installer/python/build.py'

      - name: Run UFG contract and cross-engine tests
        shell: pwsh
        run: python -m unittest discover -s 'AWOW Universal Female Generation/Installer/python/tests' -v

      - name: Assemble canonical unsigned release
        shell: pwsh
        run: >-
          & 'AWOW Universal Female Generation/release/build-release.ps1'
          -Version '${{ steps.release.outputs.version }}'
          -SkipNativeBuild
          -NativeArchivePath "$env:RUNNER_TEMP/ufg-native-v1.1.0.zip"
          -RequireCanonicalCi
          -OutputDirectory "$env:GITHUB_WORKSPACE/release-out"

      - name: Verify canonical archives and runtime images
        shell: pwsh
        run: python 'AWOW Universal Female Generation/tools/verify_packages.py' "$env:GITHUB_WORKSPACE/release-out" --require-canonical

      - name: Attest ZIP provenance
        uses: actions/attest@v4
        with:
          subject-path: release-out/*.zip

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: awow-ufg-${{ steps.release.outputs.version }}-release
          path: |
            release-out/*.zip
            release-out/*.sha256
            release-out/*-provenance.json
            release-out/*-AGP-handoff.json
          if-no-files-found: error

      - name: Create draft GitHub release for tagged builds
        if: startsWith(github.ref, 'refs/tags/ufg-v')
        shell: pwsh
        run: >-
          gh release create "$env:GITHUB_REF_NAME" --draft
          --title "AWOW Universal Female Generation v${{ steps.release.outputs.version }}"
          --notes-file 'AWOW Universal Female Generation/release/RELEASE_NOTES.md'
          release-out/*.zip release-out/*.zip.sha256 release-out/*-provenance.json release-out/*-AGP-handoff.json
        env:
          GH_TOKEN: ${{ github.token }}
