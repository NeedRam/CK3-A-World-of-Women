  awow_pregnancy_0002_d: "You and [scope:awow_other_mother.GetName] welcome [scope:awow_first_newborn.GetName] into the world — proof that life endures in this world of women."
  awow_pregnancy_0002_twins_d: "You and [scope:awow_other_mother.GetName] welcome twins [scope:awow_first_newborn.GetName] and [scope:awow_second_newborn.GetName] into the world — proof that life endures in this world of women."
  awow_pregnancy_0002_triplets_d: "You and [scope:awow_other_mother.GetName] welcome triplets [scope:awow_first_newborn.GetName], [scope:awow_second_newborn.GetName], and [scope:awow_third_newborn.GetName] into the world — proof that life endures in this world of women."
  awow_pregnancy_0002_ok: "A blessing."
  awow_pregnancy_0003_t: "A Child is Born"
