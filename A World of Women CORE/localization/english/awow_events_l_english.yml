  awow_pregnancy_0003_triplets_d: "You and [scope:awow_mother.GetName] welcome triplets [scope:awow_first_newborn.GetName], [scope:awow_second_newborn.GetName], and [scope:awow_third_newborn.GetName] into the world — proof that life endures in this world of women."
