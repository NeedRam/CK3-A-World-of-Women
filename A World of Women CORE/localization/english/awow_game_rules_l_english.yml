  # AI Matchmaking Rule
  rule_awow_ai_matchmaking_mode: "A World of Women: AI Matchmaking"
  setting_awow_ai_matchmaking_disabled: "Disabled"
  setting_awow_ai_matchmaking_disabled_desc: "#warning WARNING:#! Disables AWOW AI matchmaking. Many dynasties may die out because too few rulers will marry and produce heirs."
  setting_awow_ai_matchmaking_yearly_distributed: "Yearly — Distributed"
  setting_awow_ai_matchmaking_yearly_distributed_desc: "Spreads AI matchmaking across the year for a more natural distribution. #warning WARNING:#! Speeds 4/5 may slow for the first 3 years while many thousands of rulers find matches."
  setting_awow_ai_matchmaking_yearly_burst: "Yearly — January Burst"
  setting_awow_ai_matchmaking_yearly_burst_desc: "Runs all AI matchmaking on January 1st. #warning WARNING:#! Expect an #warning EXTREME#! lag spike on January 2nd for the first 3 years but no lag or slowdown during the rest of the year."
